# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── MySQL ─────────────────────────────────────────────────────────────────────
# Set these as environment variables on your machine, or fill them in
# application-local.properties (which is excluded from Git via .gitignore)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/amadeus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── SQL Init ──────────────────────────────────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.amadeus=INFO
